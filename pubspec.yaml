publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: '>=3.3.4 <4.0.0'
  # Built with Flutter 3.47.9 (Dart 3.13.7)

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.0
  flutter_riverpod: ^2.4.5
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.4.1

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_1024.png